name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - name: Publish the APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk fan-ir-scanner.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest fan-ir-scanner.apk \
            --title "Fan IR Scanner" \
            --notes "Latest build from main. Download fan-ir-scanner.apk and open it on the phone." \
            --target "$GITHUB_SHA"
